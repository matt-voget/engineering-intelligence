schema_version: "1"
jira:
  # The only values a user must supply by hand are base_url and credentials.
  # Everything below marked "agent-discovered" is filled in by the guided
  # onboarding flow in docs/onboarding.md after the Jira connection works.
  base_url: https://CHANGE_ME.atlassian.net
  email_env: ATLAS_ATLASSIAN_EMAIL
  token_env: JIRA_API_TOKEN
  # Agent-discovered: custom-field IDs are looked up from /rest/api/3/field and
  # verified against real issues before being set. Leave null until verified.
  team_field_id: null
  target_date_field_id: null
  gravitee_customers_field_id: null
  hierarchy_max_depth: 10
  hierarchy_batch_size: 40
  collect_accountable_work: true
  boards:
    # Exactly one board must have role: ibr. The IBR board defines which
    # tickets are in scope versus out of scope from an IBR perspective and
    # supplies the high-level workflow shown in the report. The onboarding flow
    # lists the instance's boards and asks the user to pick the IBR board.
    # (role: portfolio is accepted as a legacy alias for ibr.)
    - id: 123
      name: CHANGE_ME IBR board
      role: ibr
      url: https://CHANGE_ME.atlassian.net/jira/software/c/projects/CHANGE_ME/boards/123
  # Add read-only JQL scopes needed beyond the configured boards. IDs must be
  # stable. The IBR-versus-non-IBR work view requires one query per team with
  # the exact id team-field-<team-id>; the guided onboarding derives these in
  # docs/onboarding.md step 6. Leaving them out renders that view empty.
  queries: []
github:
  api_url: https://api.github.com
  token_env: GITHUB_PAT
  initial_lookback_days: 90
  max_pull_requests_per_repository: 500
  min_refresh_window_days: 31
  # Agent-discovered: the onboarding flow enumerates the token's organizations
  # and recently active repositories and proposes this list for confirmation.
  repositories:
    - full_name: CHANGE_ME/CHANGE_ME
      team_ids: [example-team]
