[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engineering-intelligence"
version = "0.1.0"
description = "A local, agent-friendly engineering intelligence system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<46",
  "httpx>=0.28,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.scripts]
engintel = "engineering_intelligence.cli:app"
engintel-mcp = "engineering_intelligence.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
